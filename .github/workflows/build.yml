name: Build CyberChef-faster

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly rebuild

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Package
        run: |
          cd build/prod
          rm -f BundleAnalyzerReport.html CyberChef_*.zip sha256digest.txt
          zip -qr "$GITHUB_WORKSPACE/CyberChef-faster.zip" . -x "*.br" -x "*.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: build/prod/

      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: CyberChef-faster.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CyberChef-faster.zip --clobber
          else
            gh release create latest CyberChef-faster.zip \
              --title "CyberChef-faster" \
              --notes "Instant UI, zero loading spinners. See README."
          fi

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
